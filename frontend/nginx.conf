server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://services.arcgisonline.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }
  location / { try_files $uri $uri/ /index.html; }
}
